<style>
  :root{
    --bg: #0d1420;

    --ink: #e7e3d8;
    --ink-dim: #97a1b3;
    --gold: #c79a4b;
    --gold-dim: #8a7040;
    --done: #5fa889;
    --done-bg: rgba(95,168,137,0.12);
    --skip: #b5644a;
    --focus: #d9b877;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3,.serif{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- layout ---------- */
  .app{ display:flex; height:100vh; min-height:560px; }
  .sidebar{
    width:280px; flex:0 0 280px; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    overflow:hidden;
  }
  .sidebar-head{ padding:20px 18px 14px; border-bottom:1px solid var(--line); }
  .sidebar-head h1{
    margin:0 0 4px; font-size:19px; font-weight:600; color:var(--ink); letter-spacing:.2px;
  }
  .sidebar-head p{ margin:0; font-size:11.5px; color:var(--ink-dim); }

  .progress-ring-wrap{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line);}
  .progress-num{ font-family:Georgia,serif; font-size:22px; color:var(--gold); }
  .progress-sub{ font-size:11px; color:var(--ink-dim); }
  .bar-track{ height:6px; border-radius:4px; background:var(--panel-2); overflow:hidden; flex:1; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:4px; transition:width .4s ease; }

  .phase-nav{ flex:1; overflow-y:auto; padding:8px 0; }
  .phase-item{
    display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer;
    border-left:3px solid transparent; color:var(--ink-dim); font-size:13px;
  }
  .phase-item:hover{ background:var(--panel-2); color:var(--ink); }
  .phase-item.active{ background:var(--panel-2); border-left-color:var(--gold); color:var(--ink); }
  .phase-item .pnum{ font-family:Georgia,serif; font-size:12px; color:var(--gold-dim); width:20px; flex:0 0 20px; }
  .phase-item.active .pnum{ color:var(--gold); }
  .phase-item .pdot{
    margin-left:auto; width:7px; height:7px; border-radius:50%; background:var(--panel-2); flex:0 0 7px;
    border:1px solid var(--line);
  }
  .phase-item .pdot.complete{ background:var(--done); border-color:var(--done); }
  .phase-item .pdot.partial{ background:var(--gold); border-color:var(--gold); }
  .phase-item.locked{ opacity:.45; }

  .sidebar-foot{ padding:12px 18px; border-top:1px solid var(--line); }
  .tab-toggle{ display:flex; gap:6px; }
  .tab-btn{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:7px 6px; border-radius:6px; font-size:11.5px;
  }
  .tab-btn.active{ background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:600; }

  .main{ flex:1; overflow-y:auto; padding:34px 40px 80px; max-width:900px; }
  .main-inner{ max-width:760px; }

  .phase-title{ display:flex; align-items:baseline; gap:12px; margin-bottom:2px; }
  .phase-title .em{ font-size:26px; }
  .phase-title h2{ margin:0; font-size:25px; font-weight:600; }
  .phase-caption{ color:var(--ink-dim); font-size:13px; margin:2px 0 26px; }

  .section-block{ margin-bottom:26px; }
  .section-head{ font-size:14.5px; font-weight:600; color:var(--gold); margin-bottom:3px; }
  .section-desc{ font-size:12.3px; color:var(--ink-dim); margin-bottom:10px; font-style:italic; }

  .item-row{
    display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:7px;
    margin-bottom:2px;
  }
  .item-row:hover{ background:var(--panel); }
  .chk{
    width:17px; height:17px; flex:0 0 17px; margin-top:2px; border-radius:4px;
    border:1.5px solid var(--line); background:transparent; position:relative;
  }
  .chk.checked{ background:var(--done); border-color:var(--done); }
  .chk.checked::after{
    content:''; position:absolute; left:4px; top:1px; width:5px; height:9px;
    border-right:2px solid #0d1420; border-bottom:2px solid #0d1420; transform:rotate(40deg);
  }
  .item-text{ flex:1; font-size:13.4px; color:var(--ink); cursor:pointer; }
  .item-row.checked .item-text{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }
  .yt-link{
    flex:0 0 auto; font-size:11px; color:var(--ink-dim); border:1px solid var(--line);
    border-radius:5px; padding:3px 8px; white-space:nowrap; text-decoration:none;
  }
  .yt-link:hover{ color:var(--gold); border-color:var(--gold-dim); }

  .note-box{ margin-top:22px; }
  .note-box label{ display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px; }
  .note-box textarea{
    width:100%; min-height:90px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; color:var(--ink); padding:12px; font-family:inherit; font-size:13px;
    resize:vertical;
  }
  .note-box textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .save-hint{ font-size:11px; color:var(--ink-dim); margin-top:5px; }

  .callout{
    margin-top:6px; padding:10px 13px; border-left:2px solid var(--gold-dim);
    background:var(--panel); border-radius:0 6px 6px 0; font-size:12.3px; color:var(--ink-dim);
    font-style:italic;
  }

  /* ---------- journal tab ---------- */
  .journal-header{ margin-bottom:20px; }
  .journal-add{
    display:flex; gap:8px; margin-bottom:26px;
  }
  .journal-add textarea{
    flex:1; min-height:64px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; color:var(--ink); padding:11px; font-family:inherit; font-size:13px; resize:vertical;
  }
  .journal-add button{
    background:var(--gold); color:#1a1408; border:none; border-radius:7px; padding:0 18px;
    font-weight:600; font-size:13px;
  }
  .journal-entry{
    border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:12px; background:var(--panel);
  }
  .journal-entry .je-date{ font-size:11px; color:var(--gold-dim); margin-bottom:6px; }
  .journal-entry .je-text{ font-size:13.4px; white-space:pre-wrap; }
  .journal-entry .je-del{
    float:right; background:none; border:none; color:var(--ink-dim); font-size:11px;
  }
  .je-empty{ color:var(--ink-dim); font-size:13px; font-style:italic; }

  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:14px 16px; }
  .stat-card .sv{ font-family:Georgia,serif; font-size:22px; color:var(--gold); }
  .stat-card .sl{ font-size:11px; color:var(--ink-dim); margin-top:2px; }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:760px){
    .sidebar{ width:220px; flex-basis:220px; }
    .main{ padding:24px 20px 60px; }
    .stats-grid{ grid-template-columns:1fr 1fr; }
  }
</style>

function allItemIds(){
  const ids = [];
  PHASES.forEach(p=>{
    if(p.done) return;
    p.sections.forEach((s,si)=>{
      s.items.forEach((it,ii)=> ids.push(p.id+"-"+si+"-"+ii));
    });
  });
  return ids;
}

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){ state = JSON.parse(r.value); }
  }catch(e){ /* no saved state yet */ }
  render();
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error("save failed", e); }
}

/* ================= RENDER ================= */
function pct(){
  const ids = allItemIds();
  const done = ids.filter(id=>state.checked[id]).length;
  return { done, total: ids.length, p: ids.length? Math.round(done/ids.length*100):0 };
}

function renderNav(){
  const nav = document.getElementById("phaseNav");
  nav.innerHTML = "";
  PHASES.forEach(p=>{
    const div = document.createElement("div");
    div.className = "phase-item" + (p.id===currentPhase && currentView==="phases" ? " active":"") + (p.done? " locked":"");
    let dotClass = "";
    if(!p.done){
      const ids=[]; p.sections.forEach((s,si)=>s.items.forEach((it,ii)=>ids.push(p.id+"-"+si+"-"+ii)));
      const d = ids.filter(id=>state.checked[id]).length;
      if(d===ids.length && ids.length>0) dotClass="complete";
      else if(d>0) dotClass="partial";
    } else dotClass="complete";
    div.innerHTML = `<span class="pnum">${p.id}</span><span>${p.title}</span><span class="pdot ${dotClass}"></span>`;
    div.onclick = ()=>{ currentView="phases"; currentPhase=p.id; render(); };
    nav.appendChild(div);
  });
}

function renderTopBar(){
  const {done,total,p} = pct();
  document.getElementById("pctNum").textContent = p + "%";
  document.getElementById("barFill").style.width = p + "%";
  document.getElementById("progSub").textContent = done + " / " + total + " topics";
}

function toggleItem(id){
  state.checked[id] = !state.checked[id];
  saveState();
  render();
}

function renderPhase(){
  const p = PHASES.find(x=>x.id===currentPhase);
  const main = document.getElementById("main");
  let html = `<div class="main-inner">
    <div class="phase-title"><span class="em">${p.emoji}</span><h2>Phase ${p.id} — ${p.title}</h2></div>
    <div class="phase-caption">${p.caption}</div>`;

  if(p.done){
    html += `<div class="callout">Marked complete. Revisit anytime from the sidebar — nothing here is locked.</div></div>`;
    main.innerHTML = html;
    return;
  }

  p.sections.forEach((s, si)=>{
    html += `<div class="section-block"><div class="section-head">${s.name}</div>`;
    if(s.desc) html += `<div class="section-desc">${s.desc}</div>`;
    s.items.forEach((it, ii)=>{
      const id = p.id+"-"+si+"-"+ii;
      const checked = !!state.checked[id];
      const q = it + (p.id<=6 || p.id>=16 ? " ICT forex" : " forex trading");
      html += `<div class="item-row ${checked?'checked':''}">
        <div class="chk ${checked?'checked':''}" data-id="${id}"></div>
        <div class="item-text" data-id="${id}">${it}</div>
        <a class="yt-link" target="_blank" rel="noopener" href="${YT(q)}">YouTube ↗</a>
      </div>`;
    });
    if(s.callout) html += `<div class="callout">${s.callout}</div>`;
    html += `</div>`;
  });

  const noteVal = state.notes[p.id] || "";
  html += `<div class="note-box">
    <label>Your notes on Phase ${p.id} — summarize what you learned in your own words</label>
    <textarea id="phaseNoteArea" placeholder="Write your takeaways here...">${escapeHtml(noteVal)}</textarea>
    <div class="save-hint">Saved automatically as you type.</div>
  </div></div>`;

  main.innerHTML = html;

  main.querySelectorAll(".chk, .item-text").forEach(el=>{
    el.onclick = ()=> toggleItem(el.dataset.id);
  });
  const ta = document.getElementById("phaseNoteArea");
  let t;
  ta.addEventListener("input", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{ state.notes[p.id]=ta.value; saveState(); }, 500);
  });
}

function escapeHtml(str){
  const d = document.createElement("div"); d.innerText = str; return d.innerHTML;
}

function renderJournal(){
  const main = document.getElementById("main");
  let html = `<div class="main-inner">
    <div class="phase-title"><span class="em">📓</span><h2>Trading & Learning Journal</h2></div>
    <div class="phase-caption">Freeform entries — reflections, trade reviews, lessons. Dated automatically.</div>`;

  const {done,total,p} = pct();
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="sv">${p}%</div><div class="sl">Overall progress</div></div>
    <div class="stat-card"><div class="sv">${done}</div><div class="sl">Topics checked off</div></div>
    <div class="stat-card"><div class="sv">${state.journal.length}</div><div class="sl">Journal entries</div></div>
  </div>`;

  html += `<div class="journal-add">
    <textarea id="journalInput" placeholder="What did you learn, notice, or mess up today?"></textarea>
    <button id="journalAddBtn">Add entry</button>
  </div>`;

  html += `<div id="journalList">`;
  if(state.journal.length===0){
    html += `<div class="je-empty">No entries yet. Your first one could be today's pre-market routine, or a lesson from your last trade.</div>`;
  } else {
    [...state.journal].reverse().forEach((e, idx)=>{
      const realIdx = state.journal.length-1-idx;
      html += `<div class="journal-entry">
        <button class="je-del" data-idx="${realIdx}">Delete</button>
        <div class="je-date">${e.date}</div>
        <div class="je-text">${escapeHtml(e.text)}</div>
      </div>`;
    });
  }
  html += `</div></div>`;

  main.innerHTML = html;

  document.getElementById("journalAddBtn").onclick = ()=>{
    const ta = document.getElementById("journalInput");
    if(!ta.value.trim()) return;
    state.journal.push({ date: new Date().toLocaleString(), text: ta.value.trim() });
    saveState();
    render();
  };
  main.querySelectorAll(".je-del").forEach(btn=>{
    btn.onclick = ()=>{
      state.journal.splice(parseInt(btn.dataset.idx),1);
      saveState();
      render();
    };
  });
}

function render(){
  renderNav();
  renderTopBar();
  document.getElementById("tabPhases").classList.toggle("active", currentView==="phases");
  document.getElementById("tabJournal").classList.toggle("active", currentView==="journal");
  if(currentView==="phases") renderPhase();
  else renderJournal();
}

document.getElementById("tabPhases").onclick = ()=>{ currentView="phases"; render(); };
document.getElementById("tabJournal").onclick = ()=>{ currentView="journal"; render(); };

loadState();
</script>
</body>
</html>
